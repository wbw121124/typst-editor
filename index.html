<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typst 编辑器</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <div id="app">
    <div id="toolbar">
      <span class="title">Typst 编辑器</span>
      <div class="toolbar-actions">
        <label class="font-label" for="font-size">字号:</label>
        <input id="font-size" type="number" min="10" max="40" value="14" />
        <button id="btn-save" title="保存 (Ctrl+S)">保存</button>
        <button id="btn-export-svg" title="导出 SVG (Ctrl+Alt+E)">导出 SVG</button>
        <button id="btn-export-pdf" title="导出 PDF (Ctrl+Alt+P)">导出 PDF</button>
      </div>
    </div>
    <div id="tab-bar" class="hidden">
      <div id="tabs-scroll"></div>
    </div>
    <div id="main">
      <div id="sidebar">
        <div id="sidebar-header">
          <span>文件 <span id="file-count"></span></span>
          <button id="btn-refresh-tree" title="刷新文件树">&#10227;</button>
        </div>
        <div id="file-tree"></div>
        <button id="btn-new-file" title="新建 (Ctrl+N)">+ 新建 .typ</button>
      </div>
      <div id="editor-container">
        <div id="editor"></div>
      </div>
      <div id="divider"></div>
      <div id="preview-container" class="pdf-mode">
        <div id="preview-toolbar">
          <div class="zoom-controls">
            <button id="btn-zoom-out" title="缩小">-</button>
            <span id="zoom-level"><input type="number" min="25" max="300" step="10" placeholder="100" value="100"
                class="zoom-is-default"></span>
            <button id="btn-zoom-in" title="放大">+</button>
            <button id="btn-zoom-reset" title="重置缩放">重置</button>
          </div>
        </div>
        <div id="preview" class="pdf-mode">
          <div id="preview-content">
          </div>
          <div id="pdf-viewer">
          </div>
          <div id="preview-loading">
            <div class="spinner"></div>
          </div>
        </div>
        <div id="error-panel" class="hidden"></div>
      </div>
    </div>
    <div id="statusbar">
      <span id="statusbar-file" class="sb-file">未打开文件</span>
      <span id="statusbar-pages" class="sb-segment"></span>
      <span class="sb-spacer"></span>
      <span id="statusbar-mode" class="sb-segment">PDF</span>
      <span id="statusbar-errors" class="sb-segment"></span>
      <span id="statusbar-pos" class="sb-segment">行 1, 列 1</span>
      <span id="save-status" class="sb-segment"></span>
      <span id="preview-status" class="sb-segment">正在加载 Typst 编译器...</span>
    </div>
  </div>
  <div id="file-context-menu"></div>
  <div id="toast-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
