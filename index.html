<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typst 编辑器</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <div id="app">
    <div id="toolbar">
      <span class="title">Typst 编辑器</span>
      <div class="toolbar-actions">
        <label class="font-label" id="preview-status">正在加载 Typst 编译器...</label>
        <span id="save-status"></span>
        <label class="font-label" for="font-size">字号:</label>
        <input id="font-size" type="number" min="10" max="40" value="14" />
        <button id="btn-save">保存</button>
        <button id="btn-export-svg">导出 SVG</button>
        <button id="btn-export-pdf">导出 PDF</button>
      </div>
    </div>
    <div id="main">
      <div id="sidebar">
        <div id="sidebar-header">文件</div>
        <div id="file-tree"></div>
        <button id="btn-new-file">+ 新建 .typ</button>
      </div>
      <div id="editor-container">
        <div id="editor"></div>
      </div>
      <div id="divider"></div>
      <div id="preview-container">
        <div id="preview-toolbar">
          <div class="zoom-controls">
            <button id="btn-zoom-out" title="缩小">-</button>
            <span id="zoom-level">100%</span>
            <button id="btn-zoom-in" title="放大">+</button>
            <button id="btn-zoom-reset" title="重置缩放">重置</button>
          </div>
        </div>
        <div id="preview">
          <div id="preview-content">
            <!-- <embed id="preview-content-pdf"></embed> -->
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
